<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qr-gen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f4fff'/%3E%3Cpath fill='%23fff' d='M6 6h8v8H6zM18 6h8v8h-8zM6 18h8v8H6zM18 18h4v4h-4zM24 24h2v2h-2z'/%3E%3C/svg%3E">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('qrgen-theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  :root {
    --bg: #eef1f5; --surface: #ffffff; --ink: #10151c; --muted: #5a6574;
    --line: #d9dfe7; --accent: #1f4fff; --accent-ink: #ffffff; --accent-soft: #e6ecff;
    --danger: #b3261e; --danger-soft: #fdeceb; --ok-soft: #e3f4ea; --ok: #176a3a;
    --focus: #1f4fff;
    --sans: "Avenir Next", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    --bg: #0d1218; --surface: #161d26; --ink: #e8ecf2; --muted: #93a0b1;
    --line: #263140; --accent: #7a98ff; --accent-ink: #0b1020; --accent-soft: #1d2a4d;
    --danger: #ff8a80; --danger-soft: #3a1c1b; --ok-soft: #14301f; --ok: #6fd69a;
    --focus: #9db3ff;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button, input { font: inherit; color: inherit; }

  header {
    display: flex; align-items: center; gap: 16px; padding: 14px 24px;
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em; }
  .brand svg { width: 28px; height: 28px; }
  .spacer { flex: 1; }

  .btn {
    border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
    padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: .92rem;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .55; cursor: progress; }

  /* theme switch */
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; background: none; border: 0; padding: 4px; color: var(--muted); }
  .switch .track { width: 42px; height: 24px; border-radius: 12px; background: var(--line); position: relative; transition: background .2s; }
  .switch .thumb {
    position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--surface); box-shadow: 0 0 0 1px var(--muted); transition: transform .2s;
  }
  .switch[aria-checked="true"] .track { background: var(--accent); }
  .switch[aria-checked="true"] .thumb { transform: translateX(18px); box-shadow: none; }
  .switch svg { width: 18px; height: 18px; }

  main { max-width: 880px; margin: 0 auto; padding: 32px 24px 64px; }

  h1 { font-size: 1.7rem; letter-spacing: -0.02em; margin: 0 0 6px; }
  .lede { margin: 0 0 24px; color: var(--muted); }
  label { display: block; font-weight: 600; font-size: .9rem; margin: 16px 0 6px; }
  input[type=url] {
    width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); outline-offset: 1px;
  }
  input:focus-visible { border-color: var(--focus); }

  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: .92rem; background: var(--danger-soft); color: var(--danger); }

  /* generate */
  .gen { display: grid; grid-template-columns: 1fr 300px; gap: 36px; align-items: start; }
  @media (max-width: 760px) { .gen { grid-template-columns: 1fr; } }
  .row { display: flex; gap: 10px; }
  .row input { flex: 1; min-width: 0; }
  .hint { color: var(--muted); font-size: .88rem; margin: 10px 0 0; }

  .stage {
    aspect-ratio: 1; width: 100%; border-radius: 12px; border: 1px solid var(--line);
    display: grid; place-items: center; overflow: hidden;
    background-color: #fff;
    background-image:
      linear-gradient(45deg, #e4e8ee 25%, transparent 25%, transparent 75%, #e4e8ee 75%),
      linear-gradient(45deg, #e4e8ee 25%, transparent 25%, transparent 75%, #e4e8ee 75%);
    background-size: 20px 20px; background-position: 0 0, 10px 10px;
  }
  .stage img { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  .stage .empty { color: #5a6574; font-size: .9rem; padding: 24px; text-align: center; }
  .result-actions { display: flex; gap: 10px; margin-top: 14px; }
  .result-actions .btn { flex: 1; text-align: center; text-decoration: none; color: var(--ink); }
  .result-actions .btn.primary { color: var(--accent-ink); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path fill="var(--accent-ink)" d="M6 6h8v8H6zM18 6h8v8h-8zM6 18h8v8H6zM18 18h4v4h-4zM24 24h2v2h-2z"/></svg>
    qr-gen
  </div>
  <div class="spacer"></div>
  <button class="switch" id="theme" role="switch" aria-checked="false" aria-label="Dark mode">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="track"><span class="thumb"></span></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<main>
  <!-- App -->
  <section id="app-view">
    <div id="panel-gen">
      <div class="gen">
        <div>
          <h1>Make a QR code from a link</h1>
          <p class="lede">Paste a URL and download a PNG with a transparent background.</p>
          <form id="gen-form">
            <label for="url">URL</label>
            <div class="row">
              <input id="url" type="url" inputmode="url" placeholder="https://example.com/page" required>
              <button class="btn primary" id="gen-btn" type="submit">Generate QR code</button>
            </div>
          </form>
          <div class="msg" id="gen-err" role="alert" hidden></div>
          <p class="hint">Black modules on a transparent background. The checkerboard shows what is see-through.</p>
        </div>
        <div>
          <div class="stage" id="stage">
            <img id="qr" alt="Generated QR code" hidden>
            <div class="empty" id="stage-empty">Your QR code appears here.</div>
          </div>
          <div class="result-actions" id="result-actions" hidden>
            <a class="btn primary" id="download" download="qr.png">Download PNG</a>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var root = document.documentElement;

  // ----- theme -----
  var themeBtn = $('#theme');
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    themeBtn.setAttribute('aria-checked', t === 'dark' ? 'true' : 'false');
    try { localStorage.setItem('qrgen-theme', t); } catch (e) {}
  }
  applyTheme(root.getAttribute('data-theme'));
  themeBtn.addEventListener('click', function () {
    applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  function showErr(el, text) { el.textContent = text; el.hidden = !text; }

  // ----- generate -----
  var currentObjectUrl = null;
  $('#gen-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = $('#gen-btn'); btn.disabled = true; showErr($('#gen-err'), '');
    var url = $('#url').value.trim();
    try {
      var r = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: url })
      });
      if (!r.ok) { throw new Error((await r.json()).error || 'Could not generate the QR code.'); }
      var blob = await r.blob();
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = URL.createObjectURL(blob);
      $('#qr').src = currentObjectUrl; $('#qr').hidden = false;
      $('#stage-empty').hidden = true; $('#result-actions').hidden = false;
      var host = 'qr';
      try { host = 'qr-' + new URL(url).hostname.replace(/[^a-z0-9.-]/gi, '_'); } catch (x) {}
      $('#download').href = currentObjectUrl; $('#download').setAttribute('download', host + '.png');
    } catch (err) { showErr($('#gen-err'), err.message); }
    btn.disabled = false;
  });
})();
</script>
</body>
</html>
